<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Torrondola</title>
  <meta name="description" content="La torretta che dondola: drop blocks from a swinging crane and stack the tallest tower you can.">
  <meta name="theme-color" content="#1a1028">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Torrondola">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #1a1028;
      touch-action: none;
      overscroll-behavior: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    canvas {
      position: fixed;
      left: 0;
      top: 0;
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    noscript {
      display: block;
      padding: 2rem;
      color: #fff4dc;
      font: 16px/1.4 monospace;
      text-align: center;
    }
  </style>
</head>
<body>
  <canvas id="screen" aria-label="Torrondola game"></canvas>
  <noscript>Torrondola needs JavaScript to run.</noscript>
  <script type="module" src="src/main.js"></script>
</body>
</html>
